services:
  - type: web
    name: ai-learning-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMMA_API_KEYS
        sync: false
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
